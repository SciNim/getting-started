name: periodic test

on:
  schedule:
    # Run every month the 20th when the clock is 13:00 UTC
    - cron: '0 13 20 * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04 # libpcre3 is not packaged in ubuntu 26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v2
      - run: sudo apt-get install -y libpcre3 # nim-markdown (used by nimib) imports std/re
      - run: pip install scipy numpy
      - name: "install_nim"
        id: install_nim
        uses: iffy/install-nim@v4.1.1
      - run: nimble install -y
      - name: GenBook
        run: nimble genbook