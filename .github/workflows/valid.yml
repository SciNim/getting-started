name: valid

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-24.04 # libpcre3 is not packaged in ubuntu 26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v2
      - run: sudo apt-get install -y libpcre3 # nim-markdown (used by nimib) imports std/re
      - run: pip install scipy numpy
      - name: "install_nim"
        id: install_nim
        uses: iffy/install-nim@v4.1.1
      - run: nimble install -y
      - name: GenBook
        run: nimble genbook
      - run: echo Commit hash = ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.pull_request.head.sha }}
          path: docs/
          retention-days: 1
          if-no-files-found: error
